name: Infra review

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'azure-pipelines.yml'
      - 'app/Dockerfile'
      - 'app/nginx.conf'

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    uses: marcelomusza/mulzatech-infra-reviewer/.github/workflows/review.yml@main
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}