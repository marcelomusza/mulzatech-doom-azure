trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  dockerHubServiceConnection: 'dockerhub-mulzatech'
  imageRepository: 'marcelomusza/mulzatech-doom'
  dockerfilePath: 'app/Dockerfile'
  buildContext: 'app'
  tag: '$(Build.BuildId)'

steps:
  - task: Docker@2
    displayName: Build image
    inputs:
      command: build
      repository: $(imageRepository)
      dockerfile: $(dockerfilePath)
      buildContext: $(buildContext)
      tags: |
        $(tag)
        latest

  - script: |
      docker run -d --name ci-test -p 8080:80 $(imageRepository):$(tag)
      sleep 5
      curl -f http://localhost:8080/ || exit 1
      docker rm -f ci-test
    displayName: Validate container responds

  - task: Docker@2
    displayName: Push image
    inputs:
      command: push
      containerRegistry: $(dockerHubServiceConnection)
      repository: $(imageRepository)
      tags: |
        $(tag)
        latest